<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>Покадрово · Логотип в движении</title><style>.pk-brand-mark{display:inline-block;flex-shrink:0;vertical-align:middle;overflow:visible}

@keyframes pk-brand-back-in{0%,8%{opacity:0;transform:translate(-8px,14px) rotate(-12deg)}48%{opacity:1;transform:translate(2px,-3px) rotate(3deg)}78%,100%{opacity:1;transform:none}}

@keyframes pk-brand-play-in{0%,46%{opacity:0;transform:translate(-5px,0) scale(.65)}80%,100%{opacity:1;transform:none}}

@media(prefers-reduced-motion:reduce){.pk-brand-mark,.pk-brand-mark *{animation:none!important;transition:none!important;transform:none!important}.pk-brand-glint{opacity:0!important}}

transform:scaleX(1)}}@media(max-width:600px){header,footer{padding:22px;letter-spacing:1px}header span,footer span{display:none}.lockup{flex-direction:column;gap:26px}.wordmark{letter-spacing:-2px;text-align:center;font-size:47px}.wordmark small{font-size:8px;letter-spacing:4px}main{min-height:600px;padding-top:50px}.eyebrow{font-size:9px;letter-spacing:2.4px}.line{margin-top:52px}.tagline{text-align:center;font-size:13px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.line:after{transform:none}}
