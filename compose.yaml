name: pokadrovo
services:
  app:
    build:
      context: .
      target: runtime
    image: pokadrovo-standalone:local
    init: true
    restart: unless-stopped
    environment:
      POKADROVO_PUBLIC_ORIGIN: ${POKADROVO_PUBLIC_ORIGIN:-http://localhost:5173}
      POKADROVO_PORT: "5173"
      POKADROVO_DATA_DIR: /data
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - private-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    stop_grace_period: 20s
volumes:
  private-data:
